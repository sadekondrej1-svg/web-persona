<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Technická řešení</title>

    <!-- Typografie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: '#10b981',
                    }
                }
            }
        }
    </script>

    <!-- Vlastní styly -->
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="bg-[#09090b] text-zinc-100 font-sans antialiased selection:bg-brand selection:text-black min-h-screen overflow-x-hidden relative">
    <!-- SECTION: NAVBAR -->
    <header class="fixed top-0 inset-x-0 z-50 bg-[#09090b]/80 backdrop-blur-md border-b border-white/[0.08]">
        <nav class="max-w-6xl mx-auto px-6 sm:px-8 h-16 flex items-center justify-between" aria-label="Hlavní navigace">
            <a href="#" class="text-sm tracking-tight relative inline-flex items-center group shrink-0">
                <!-- Původní dvoubarevný text -->
                <span class="text-zinc-500 group-hover:text-zinc-300 transition-colors">ondřej</span>
                <span class="font-semibold text-zinc-400 ml-1">šádek</span>

                <!-- Překryvná vrstva: odlesk maskovaný striktně do tvaru písmen -->
                <span class="shimmer-text-overlay" aria-hidden="true">
                    <span>ondřej</span>
                    <span class="font-semibold ml-1">šádek</span>
                </span>
            </a>

            <!-- Odkazy a tlačítko na desktopu (na mobilu skryto pro maximální klid) -->
            <div class="hidden sm:flex items-center gap-6">
                <a href="#projekty" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Projekty</a>
                <a href="#workflow" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Workflow</a>
                <a href="#kontakt" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-zinc-200 bg-zinc-900 border border-white/10 hover:border-white/20 hover:text-white rounded-lg transition-colors min-h-[36px]">
                    Kontakt
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 sm:px-8 relative z-10">
        <!-- SECTION: HERO -->
        <section class="pt-28 sm:pt-36 pb-16 sm:pb-24">
            <div id="hero-interactive-zone" class="relative w-full max-w-3xl flex flex-col justify-center">
                <!-- SVG Canvas pro dynamický paprsek mezi čočkou a textem -->
                <svg id="scanner-beam-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-20 overflow-visible" aria-hidden="true">
                    <!-- Vnější měkký difuzní kyanový obal -->
                    <line id="laser-line-glow" x1="0" y1="0" x2="0" y2="0" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
                    <!-- Ostré bílé jádro -->
                    <line id="laser-line-core" x1="0" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
                    <!-- Mikro-ohnisko v místě dopadu na písmeno -->
                    <circle id="laser-impact-spark" cx="0" cy="0" r="3" fill="#ffffff" />
                </svg>

                <!-- 1. Hlavní třířádkový nadpis se světlovodivou luminiscencí -->
                <div id="hero-headline-container" class="relative w-full select-none cursor-default">
                    <!-- Základní vrstva (v klidu tlumená) -->
                    <h1 class="w-full text-[1.2rem] xs:text-[1.4rem] sm:text-3xl md:text-4xl lg:text-[2.65rem] font-semibold tracking-[-0.015em] text-zinc-500 leading-[1.32] sm:leading-[1.34] flex flex-col gap-y-2.5 sm:gap-y-3.5">
                        <span class="whitespace-nowrap">Vývoj webových <span class="scan-target" data-line="1">aplikací</span><span class="text-zinc-600">.</span></span>
                        <span class="whitespace-nowrap">Systémová <span class="scan-target" data-line="2">integrace</span><span class="text-zinc-600">.</span></span>
                        <span class="whitespace-nowrap"><span class="scan-target" data-line="3">Automatizace</span><span class="text-zinc-600">.</span></span>
                    </h1>

                    <!-- Překryvná vrstva: světlovodivá luminiscence uvnitř písmen -->
                    <div class="headline-luminescence-overlay absolute inset-0 w-full text-[1.2rem] xs:text-[1.4rem] sm:text-3xl md:text-4xl lg:text-[2.65rem] font-semibold tracking-[-0.015em] leading-[1.32] sm:leading-[1.34] flex flex-col gap-y-2.5 sm:gap-y-3.5 pointer-events-none select-none" aria-hidden="true">
                        <span class="whitespace-nowrap">Vývoj webových aplikací.</span>
                        <span class="whitespace-nowrap">Systémová integrace.</span>
                        <span class="whitespace-nowrap">Automatizace.</span>
                    </div>
                </div>

                <!-- 2. Hardware Optical Scanner Component (Laserová sonda) -->
                <div id="scanner-track" class="h-[1px] w-full max-w-xl bg-white/[0.08] relative my-6 sm:my-7">
                    <!-- Matné dorazy na obou koncích -->
                    <div class="scanner-endstop left-0"></div>
                    <div class="scanner-endstop right-0"></div>

                    <!-- Skenovací hlava (Carriage) -->
                    <div id="scanner-carriage" class="scanner-carriage">
                        <!-- Mikro-čočka v kyanové barvě -->
                        <div id="scanner-lens" class="scanner-lens"></div>
                    </div>
                </div>

                <!-- 3. Podtitul -->
                <p class="text-base sm:text-lg text-zinc-400 font-normal max-w-xl leading-relaxed">
                    Autorská řešení s důrazem na deterministické chování a nulovou údržbu.
                </p>

                <!-- 4. CTA tlačítka -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-5 mt-8 sm:mt-10">
                    <a href="#projekty" class="inline-flex items-center justify-center min-h-[44px] px-6 py-3 rounded-lg text-sm font-medium bg-zinc-900 text-zinc-100 border border-white/[0.08] border-t-white/20 hover:border-white/20 transition shadow-sm w-full sm:w-auto text-center">
                        Prozkoumat práci
                    </a>
                    <a href="#kontakt" class="inline-flex items-center justify-center min-h-[44px] px-4 py-2.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 transition w-full sm:w-auto text-center">
                        Kontaktovat
                    </a>
                </div>
            </div>

            <!-- Spodní oddělovač (Specular Edge) -->
            <div class="mt-16 sm:mt-24 h-[1px] w-full bg-gradient-to-r from-transparent via-white/[0.12] to-transparent"></div>
        </section>

        <!-- SECTION: BENTO_GRID -->

        <!-- SECTION: WORKFLOW -->
    </main>

    <!-- SECTION: FOOTER -->

    <!-- Vlastní logika -->
    <script src="src/js/main.js"></script>
</body>

</html>
