<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Technická řešení</title>

    <!-- Typografie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: '#10b981',
                    }
                }
            }
        }
    </script>

    <!-- Vlastní styly -->
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="bg-[#09090b] text-zinc-100 font-sans antialiased selection:bg-brand selection:text-black min-h-screen overflow-x-hidden">

    <!-- SECTION: NAVBAR -->
    <header class="fixed top-0 inset-x-0 z-50 bg-[#09090b]/80 backdrop-blur-md border-b border-white/[0.08]">
        <nav class="max-w-6xl mx-auto px-6 sm:px-8 h-16 flex items-center justify-between" aria-label="Hlavní navigace">
            <a href="#" class="text-sm tracking-tight relative inline-flex items-center group shrink-0">
                <!-- Původní dvoubarevný text -->
                <span class="text-zinc-500 group-hover:text-zinc-300 transition-colors">ondřej</span>
                <span class="font-semibold text-zinc-400 ml-1">šádek</span>

                <!-- Překryvná vrstva: odlesk maskovaný striktně do tvaru písmen -->
                <span class="shimmer-text-overlay" aria-hidden="true">
                    <span>ondřej</span>
                    <span class="font-semibold ml-1">šádek</span>
                </span>
            </a>

            <!-- Odkazy a tlačítko na desktopu (na mobilu skryto pro maximální klid) -->
            <div class="hidden sm:flex items-center gap-6">
                <a href="#projekty" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Projekty</a>
                <a href="#workflow" class="text-sm font-medium text-zinc-400 hover:text-white transition-colors">Workflow</a>
                <a href="#kontakt" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-zinc-200 bg-zinc-900 border border-white/10 hover:border-white/20 hover:text-white rounded-lg transition-colors min-h-[36px]">
                    Kontakt
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 sm:px-8">
        <!-- SECTION: HERO -->
        <section class="pt-28 sm:pt-44 pb-16 sm:pb-24">
            <!-- Hlavní headline kontejner s radiální luminiscencí -->
            <div id="hero-headline-container" class="relative w-full max-w-4xl select-none cursor-default">
                <!-- Základní vrstva (v klidu tlumená) -->
                <h1 class="w-full text-[1.45rem] xs:text-[1.55rem] sm:text-4xl md:text-5xl lg:text-6xl font-semibold tracking-[-0.015em] text-zinc-500 leading-[1.28] sm:leading-[1.3] flex flex-col gap-y-2.5 sm:gap-y-3.5">
                    <span class="whitespace-nowrap">Vývoj webových aplikací<span class="text-zinc-600">.</span></span>
                    <span class="whitespace-nowrap">Systémová integrace<span class="text-zinc-600">.</span></span>
                    <span class="whitespace-nowrap">Automatizace<span class="text-zinc-600">.</span></span>
                </h1>

                <!-- Překryvná vrstva: zářivá bílá maskovaná radiální čočkou -->
                <div class="headline-luminescence-overlay absolute inset-0 w-full text-[1.45rem] xs:text-[1.55rem] sm:text-4xl md:text-5xl lg:text-6xl font-semibold tracking-[-0.015em] text-white leading-[1.28] sm:leading-[1.3] flex flex-col gap-y-2.5 sm:gap-y-3.5 pointer-events-none select-none" aria-hidden="true">
                    <span class="whitespace-nowrap">Vývoj webových aplikací<span class="text-zinc-400">.</span></span>
                    <span class="whitespace-nowrap">Systémová integrace<span class="text-zinc-400">.</span></span>
                    <span class="whitespace-nowrap">Automatizace<span class="text-zinc-400">.</span></span>
                </div>
            </div>

            <!-- Subtext -->
            <p class="text-base sm:text-lg text-zinc-400 font-normal max-w-2xl mt-6 leading-relaxed">
                Autorská řešení s důrazem na deterministické chování a nulovou údržbu.
            </p>

            <!-- Interakce a CTA -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-6 mt-8 sm:mt-10">
                <a href="#projekty" class="inline-flex items-center justify-center min-h-[44px] px-6 py-3 rounded-lg text-sm font-medium bg-zinc-900 text-zinc-100 border border-white/[0.08] border-t-white/20 hover:border-white/20 transition shadow-sm w-full sm:w-auto text-center">
                    Prozkoumat práci
                </a>
                <a href="#kontakt" class="inline-flex items-center justify-center min-h-[44px] px-4 py-2.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 transition w-full sm:w-auto text-center">
                    Kontaktovat
                </a>
            </div>

            <!-- Spodní oddělovač (Specular Edge) -->
            <div class="mt-16 sm:mt-28 h-[1px] w-full bg-gradient-to-r from-transparent via-white/[0.12] to-transparent"></div>
        </section>

        <!-- SECTION: BENTO_GRID -->

        <!-- SECTION: WORKFLOW -->
    </main>

    <!-- SECTION: FOOTER -->

    <!-- Vlastní logika -->
    <script src="src/js/main.js"></script>
</body>

</html>
