<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Technická řešení</title>

    <!-- Typografie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: '#10b981',
                    }
                }
            }
        }
    </script>

    <!-- Vlastní styly -->
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="bg-[#09090b] text-zinc-100 font-sans antialiased selection:bg-brand selection:text-black min-h-screen">

    <!-- SECTION: NAVBAR -->
    <header class="fixed top-0 inset-x-0 z-50 bg-[#09090b]/80 backdrop-blur-md border-b border-white/[0.08]">
        <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between" aria-label="Hlavní navigace">
            <a href="#" class="text-sm tracking-tight relative inline-flex items-center group">
                <!-- Původní dvoubarevný text -->
                <span class="text-zinc-500 group-hover:text-zinc-300 transition-colors">ondřej</span>
                <span class="font-semibold text-zinc-400 ml-1">šádek</span>

                <!-- Překryvná vrstva: odlesk maskovaný striktně do tvaru písmen -->
                <span class="shimmer-text-overlay" aria-hidden="true">
                    <span>ondřej</span>
                    <span class="font-semibold ml-1">šádek</span>
                </span>
            </a>

            <div class="flex items-center gap-6">
                <div class="flex items-center gap-6 text-sm font-medium text-zinc-400">
                    <a href="#projekty" class="hover:text-white transition-colors">Projekty</a>
                    <a href="#workflow" class="hover:text-white transition-colors">Workflow</a>
                </div>
                <a href="#kontakt" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-zinc-950 bg-brand hover:bg-emerald-400 rounded-md transition-colors">
                    Kontakt
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6">
        <!-- SECTION: HERO -->
        <section class="pt-32 sm:pt-40 pb-16 sm:pb-24">
            <!-- Status řádek -->
            <div class="flex items-center gap-2.5 font-mono text-xs tracking-wider text-zinc-500 uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500/80 animate-pulse shrink-0"></span>
                <span>Independent Systems &amp; Software Developer</span>
            </div>

            <!-- Hlavní headline (Swiss Engineering) -->
            <h1 class="mt-8 text-4xl sm:text-6xl font-semibold tracking-tight text-zinc-100 max-w-4xl leading-[1.12]">
                Vývoj webových aplikací<span class="text-zinc-500">.</span><br>
                Systémová integrace<span class="text-zinc-500">.</span><br>
                Automatizace<span class="text-zinc-500">.</span>
            </h1>

            <!-- Subtext -->
            <p class="text-base sm:text-lg text-zinc-400 font-normal max-w-2xl mt-6 leading-relaxed">
                Autorská řešení s důrazem na deterministické chování a nulovou údržbu.
            </p>

            <!-- Interakce a CTA -->
            <div class="flex items-center gap-6 mt-8">
                <a href="#projekty" class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium bg-zinc-900 text-zinc-100 border border-white/[0.08] border-t-white/20 hover:border-white/20 transition shadow-sm">
                    Prozkoumat práci
                </a>
                <a href="#kontakt" class="text-sm font-medium text-zinc-400 hover:text-zinc-100 transition">
                    Kontaktovat
                </a>
            </div>

            <!-- Spodní oddělovač (Specular Edge) -->
            <div class="mt-20 sm:mt-28 h-[1px] w-full bg-gradient-to-r from-transparent via-white/[0.12] to-transparent"></div>
        </section>

        <!-- SECTION: BENTO_GRID -->

        <!-- SECTION: WORKFLOW -->
    </main>

    <!-- SECTION: FOOTER -->

    <!-- Vlastní logika -->
    <script src="src/js/main.js"></script>
</body>

</html>
